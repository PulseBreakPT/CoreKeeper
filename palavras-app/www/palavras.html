<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#72dff4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Palavra</title>
    <script type="module" crossorigin src="./assets/palavras-CiywShq5.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/palavras-DrGk9GNh.css">
  </head>
  <body>
    <main id="app">
      <section class="menu" id="menu" aria-labelledby="titulo-menu"></section>

      <section class="jogo" id="jogo" hidden aria-live="polite">
        <header class="topo">
          <button id="voltar" type="button" aria-label="Voltar ao menu">‹</button>
          <div><small>PONTOS</small><strong id="pontos">0</strong></div>
          <div><small>VIDAS</small><strong id="vidas" class="vidas">♥ ♥ ♥</strong></div>
          <div><small>COMBO</small><strong id="combo">×0</strong></div>
          <button id="pausa" type="button" aria-label="Pausar">Ⅱ</button>
        </header>

        <div class="tempo" aria-label="Tempo restante"><i id="barra-tempo"></i></div>
        <div class="heat"><i id="heat-barra"></i><span id="heat-texto">HEAT 0%</span></div>
        <div class="ronda"><span id="modo-etiqueta">PLURAL</span><em id="evento-ronda">RONDA NORMAL</em><b id="numero-pergunta">01</b></div>
        <div class="fantasma-recorde"><i id="fantasma-barra"></i><span id="fantasma-recorde">RECORDE ±0</span></div>

        <section class="pergunta">
          <p id="instrucao">Escreve o plural</p>
          <h1 id="palavra">ÁRVORE</h1>
          <div class="resposta-wrap" id="resposta-wrap">
            <input id="resposta" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" maxlength="32" aria-label="Resposta" />
            <span id="estado-input">A TUA RESPOSTA</span>
          </div>
          <button class="confirmar" id="confirmar" type="button"><span>CONFIRMAR</span><b>→</b></button>
          <div class="historico" id="historico" aria-label="Respostas anteriores"></div>
        </section>

        <div class="feedback" id="feedback" hidden><strong id="feedback-titulo">CERTO</strong><span id="feedback-texto">+145 PONTOS</span></div>
        <div class="contagem" id="contagem" hidden><small id="contagem-modo">PLURAL</small><span>PREPARA-TE</span><b id="contagem-numero">3</b></div>

        <section class="painel" id="painel" hidden>
          <small id="painel-etiqueta">PARTIDA TERMINADA</small>
          <h2 id="painel-titulo">1 250</h2>
          <p id="painel-texto">NOVO RECORDE</p><div class="medalha-perfeita" id="medalha-perfeita" hidden>◆ PERFECT RUN</div><div class="resumo"><span><b id="resumo-certas">0</b><small>CERTAS</small></span><span><b id="resumo-erradas">0</b><small>ERRADAS</small></span><span><b id="resumo-combo">0</b><small>MELHOR COMBO</small></span><span><b id="resumo-tempo">0,0s</b><small>TEMPO MÉDIO</small></span></div>
          <button id="rever-erros" type="button">REVER ERROS <b>›</b></button>
          <button id="jogar-novamente" type="button">JOGAR NOVAMENTE <b>↻</b></button>
          <button id="ir-menu" type="button">ESCOLHER OUTRO MODO</button>
        </section>
      </section>
      <section class="revisao" id="revisao" hidden><header><button id="fechar-revisao" type="button">‹</button><span><small>DESEMPENHO</small><h2>Palavras a rever</h2></span></header><div id="lista-erros"></div></section>
    </main>
  </body>
</html>
