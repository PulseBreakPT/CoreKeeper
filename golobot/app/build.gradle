plugins {
    id 'com.android.application'
}

android {
    namespace 'pt.golobot.predictor'
    compileSdk 35

    defaultConfig {
        applicationId 'pt.golobot.predictor'
        minSdk 26
        targetSdk 34
        versionCode 21
        versionName '2.1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
