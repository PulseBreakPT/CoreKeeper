name: GOLOBOT APK

on:
  push:
    branches:
      - golobot-apk-build-20260925

jobs:
  build:
    name: Build verified Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Compile GOLOBOT
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p golobot :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs golobot/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK
        run: cp golobot/app/build/outputs/apk/debug/app-debug.apk GOLOBOT-v2.1-fixed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GOLOBOT-v2.1-fixed
          path: GOLOBOT-v2.1-fixed.apk
          if-no-files-found: error
