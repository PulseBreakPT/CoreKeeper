name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  apk:
    name: APK de debug
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The default list asks for the retired `tools` package, which makes
          # sdkmanager exit 1. Ask for exactly what the build uses.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: the-hollow-star-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  nightgrid:
    name: Nightgrid — testes e APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Cache Godot e modelos de exportação
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/opt/godot
            ~/.local/share/godot/export_templates
          key: godot-4.3-stable-android
      - name: Instalar ferramentas
        run: nightgrid/scripts/toolchain.sh
      - name: Testes de jogabilidade e APK
        run: nightgrid/scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nightgrid-apk
          path: nightgrid/build/game-debug.apk
